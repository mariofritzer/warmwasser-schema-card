<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local layout editor harness</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 1050px; margin: auto; padding: 1rem; color: #222; }

    ha-form { display: block; padding: .4rem; border: 1px dotted #aaa; }
    #result { font-weight: bold; } .pass { color: #075; } .fail { color: #b12; }
  </style>
</head>
<body>
  <h1>Local layout editor harness</h1>
  <p>Test instance only. The normal editor and card gates remain closed. Mock entities are local to this page.</p>
  <div class="actions">

    <button id="solo-wp">Standalone WP Apply + reload</button>
    <button id="solo-wp-baffle">Standalone WP baffle</button>

  </div>
  <div id="editor"></div>
  <p id="result" role="status"></p>
  <h2>Last emitted configuration</h2><pre id="config">No event yet</pre>
  <script>
    // Minimal stand-in for HA's form: the actual editor and card remain real.
    customElements.define('ha-form', class extends HTMLElement {
      connectedCallback() { this.textContent = 'Home Assistant form mock'; }
    });
    customElements.define('ha-icon', class extends HTMLElement {});
  </script>
  <script src="../../warmwasser-schema-card.js"></script>
  <script>
    (() => {
      const fixture = () => ({ type: 'custom:warmwasser-schema-card', sprache: 'en',
        speicher: { typ: 'schicht' }, fm: { pumpe: 'sensor.fm', temp: 'sensor.temp' },
        wp: { betrieb: 'sensor.wp' } });
      let config, hass, editor, enabledWp;
      const copy = value => JSON.parse(JSON.stringify(value));
      const output = document.getElementById('config'), result = document.getElementById('result');
      // Test-only instrumentation records real synchronous browser layout at
      // each connected SVG viewBox transition, including rollback.
      const viewportEvents=[];
      const nativeSetAttribute=SVGElement.prototype.setAttribute;
      SVGElement.prototype.setAttribute=function(name,value) {
        if (name!=='viewBox' || !this.isConnected) return nativeSetAttribute.call(this,name,value);
        const before=this.getBoundingClientRect(), old=this.getAttribute(name);
        nativeSetAttribute.call(this,name,value);
        const after=this.getBoundingClientRect(), root=this.getRootNode();
        viewportEvents.push({owner:root.host?.localName,old,value,
          before:{width:before.width,height:before.height},after:{width:after.width,height:after.height}});
      };
      const realTextStage=stageLegacyHeatingTextCandidate;
      const targetProbes=[];
      const realTextInventory=inspectMeasuredLayoutTexts;
      const realShadowPolicy=inspectLayoutShadowPolicy;
      const realTargetReferences=inspectLayoutTargetReferences;
      const realSymbolPaint=inspectLayoutSymbolPaint;
      const realPipePaint=inspectLayoutPipePaint;
      const realCompleteFm=inspectCompleteSimpleFmPaint;
      let lastInventory=null,lastComplete=null,lastStage=null,lastCompleteMatrix=null,lastSymbol=null;
      inspectMeasuredLayoutTexts=(...args)=>{
        const checked=realTextInventory(...args);
        lastInventory=checked;
        result.textContent+=` | candidate inventory: ${checked.reason}${checked.count===undefined?'':` (${checked.count})`}${checked.detail ? ` ${JSON.stringify(checked.detail)}` : ''}`;
        return checked;
      };
      inspectLayoutShadowPolicy=(...args)=>{
        const checked=realShadowPolicy(...args);
        result.textContent+=` | shadow policy: ${checked.reason}${checked.shadows ? ` (${checked.shadows.length})` : ''}`;
        return checked;
      };
      inspectLayoutTargetReferences=(...args)=>{
        const checked=realTargetReferences(...args);
        result.textContent+=` | target references: ${checked.reason}`;
        return checked;
      };
      inspectLayoutSymbolPaint=(...args)=>{
        const checked=realSymbolPaint(...args);
        lastSymbol=checked;
        result.textContent+=` | symbol paint: ${checked.reason}${checked.symbols ? ` (${checked.symbols.length})` : ''}${checked.detail ? ` ${JSON.stringify(checked.detail)}` : ''}`;
        return checked;
      };
      inspectLayoutPipePaint=(...args)=>{
        const checked=realPipePaint(...args);
        result.textContent+=` | pipe paint: ${checked.reason}${checked.routes ? ` (${checked.routes} routes, ${checked.stubs} stubs)` : ''}`;
        return checked;
      };
      inspectCompleteSimpleFmPaint=(...args)=>{
        const checked=realCompleteFm(...args);lastComplete=checked;
        const matrix=args[2]?.getScreenCTM?.();if(matrix)lastCompleteMatrix={a:matrix.a,b:matrix.b,c:matrix.c,d:matrix.d,e:matrix.e,f:matrix.f};
        result.textContent+=` | complete FM: ${checked.status}`;return checked;
      };
      stageLegacyHeatingTextCandidate=async (...args)=>{
        const checked=await realTextStage(...args);
        lastStage={reason:checked.reason,detail:checked.detail,mismatch:checked.mismatch};
        const stageOwner=args[0]?.getRootNode()?.host?.localName;
        result.textContent+=` | stage: ${checked.reason}${checked.detail?` ${JSON.stringify(checked.detail)}`:''}${checked.mismatch ? ` ${JSON.stringify(checked.mismatch)}` : ''}${checked.textStyleParity ? ` ${checked.textStyleParity}` : ''}${checked.symbolStrokeProof ? ` ${checked.symbolStrokeProof.reason}` : ''}${checked.pipeStrokeProof ? ` ${checked.pipeStrokeProof.reason}` : ''}${checked.ambientPaintProof ? ` ${checked.ambientPaintProof.reason}` : ''}`;
        if (checked.held) result.textContent+=` | held: ${checked.held.validate()?'fresh':checked.held.reason}${checked.held.detail?` ${JSON.stringify(checked.held.detail)}`:''}`;
        if (checked.held?.probe) {const realProbe=checked.held.probe;checked.held.probe=(...args)=>{
          const checkedProbe=realProbe(...args);targetProbes.push({owner:stageOwner,status:checkedProbe.status});
          result.textContent+=` | target probe: ${checkedProbe.status} ${checkedProbe.reason||''} | re-isolated: ${checked.held.validate()?'fresh':checked.held.reason}`;return checkedProbe;
        };}
        return checked;
      };
      function install(nextConfig) {
        config = copy(nextConfig);
        const host = document.getElementById('editor'); host.replaceChildren();
        editor = document.createElement('warmwasser-schema-card-editor');
        editor._visualLayoutEditorEnabled = () => true; // Test instance only.
        const apply=editor._applyLayoutDraft.bind(editor);
        editor._applyLayoutDraft=()=>{try {const job=layoutTextMeasurementJobs.get(editor),svg=editor._layoutPanel?.previewRoot.querySelector('svg'),m=svg?.getScreenCTM?.(),diagnostic=job?{pending:job.pending,ready:job.ready,
          current:job.current?.(job.generation),receipt:job.receipt?.validate?.(),held:job.held?.validate?.(),heldReason:job.held?.reason,
          checkedMatrix:lastCompleteMatrix,applyMatrix:m?{a:m.a,b:m.b,c:m.c,d:m.d,e:m.e,f:m.f}:null}:null;
          const value=apply();editor.dataset.lastApply=JSON.stringify({value,diagnostic});return value;}
          catch(error) {editor.dataset.lastApply=`error: ${error.message}`;throw error;}};
        editor.addEventListener('config-changed', event => {
          config = copy(event.detail.config);
          output.textContent = JSON.stringify(config, null, 2);
          editor.setConfig(copy(config)); // Match the synchronous HA echo.
        });
        host.appendChild(editor); editor.hass = hass; editor.setConfig(copy(config));
      }
      function reset() {
        enabledWp = true;
        hass = { language: 'en', states: { 'sensor.fm': { state: 'on' }, 'sensor.temp': { state: '42' }, 'sensor.wp': { state: 'on' } } };
        output.textContent = 'No event yet'; result.textContent = '';
        install(fixture());
      }
      function separated() {
        enabledWp = true;
        hass = { language: 'en', states: { 'sensor.fm': { state: 'on' }, 'sensor.temp': { state: '42' }, 'sensor.wp': { state: 'on' } } };
        const next = fixture(); next.speicher.typ = 'getrennt';
        next.layout = { version: 2, components: { fm: { x: -110, y: 14 } },
          ports: { 'tank.fm-supply': { mode: 'manual', side: 'left' }, 'tank.fm-return': { mode: 'manual', side: 'left' },
            'fm.supply': { mode: 'manual', side: 'right' }, 'fm.return': { mode: 'manual', side: 'right' } } };
        output.textContent = 'No event yet'; result.textContent = ''; install(next);
      }
      function temperature() {
        const states = { ...hass.states, 'sensor.temp': { state: hass.states['sensor.temp'].state === '42' ? '1000000000' : '42' } };
        hass = { ...hass, states }; editor.hass = hass;
      }
      function wp() {
        enabledWp = !enabledWp;
        config = { ...config, wp: enabledWp ? { betrieb: 'sensor.wp' } : {} };
        editor.setConfig(copy(config));
      }
      function volume(value='W'.repeat(80)) {
        enabledWp=true;
        hass={language:'en',states:{'sensor.fm':{state:'on'},'sensor.temp':{state:'42'},'sensor.wp':{state:'on'}}};
        const next=fixture();next.speicher.volumen=value;install(next);
        const ui=editor._layoutPanel,x=Number(ui.inputs.x.value),y=Number(ui.inputs.y.value);
        ui.inputs.x.value=String(x+30);ui.inputs.x.dispatchEvent(new Event('change',{bubbles:true}));
        ui.inputs.y.value=String(y+15);ui.inputs.y.dispatchEvent(new Event('change',{bubbles:true}));
        result.textContent=ui.apply.disabled?'PASS: unsafe volume remains pending/unsupported; apply disabled':'FAIL: unsafe volume was enabled';
        result.className=ui.apply.disabled?'pass':'fail';
      }
      function canonicalSvg() {
        const card = document.createElement('warmwasser-schema-card');
        card.setConfig(copy(config)); card._hass = hass;
        const container = document.createElement('div'); container.innerHTML = card._render();
        return container.querySelector('svg')?.outerHTML;
      }
      const nextFrame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
      async function waitFor(predicate, label) {
        for(let i=0;i<180;i++) { if(predicate()) return; await nextFrame(); }
        throw new Error(`${label} (timed out)`);
      }
      async function smoke() {
        const checks = [];
        const check = (condition, label) => { checks.push({ ok: !!condition, label }); if (!condition) throw new Error(label); };
        try {
          reset();
          let ui = editor._layoutPanel;
          check(!!ui.previewRoot.querySelector('svg'), 'canonical SVG preview');
          check(ui.overlay.getBoundingClientRect().width > 0 && getComputedStyle(ui.overlay).pointerEvents === 'none' &&
            ui.handles.length > 0 && ui.handles.every(handle=>getComputedStyle(handle).pointerEvents==='auto' && getComputedStyle(handle).touchAction==='none'), 'device-only touch hit areas');
          const x = Number(ui.inputs.x.value), y = Number(ui.inputs.y.value);
          ui.inputs.x.value = String(x + 30); ui.inputs.x.dispatchEvent(new Event('change', { bubbles: true }));
          ui.inputs.y.value = String(y + 15); ui.inputs.y.dispatchEvent(new Event('change', { bubbles: true }));
          await waitFor(()=>!ui.apply.disabled, 'candidate validation');
          const candidateSvg = ui.previewRoot.querySelector('svg')?.outerHTML;
          check(!ui.apply.disabled && !!candidateSvg && candidateSvg !== canonicalSvg(), 'candidate preview and valid apply');
          ui.undo.click(); check(Number(ui.inputs.y.value) === y, 'undo');
          ui.redo.click(); check(Number(ui.inputs.y.value) === y + 15, 'redo');
          await waitFor(()=>!ui.apply.disabled, 'redo validation');
          ui.apply.click(); check(config.layout.components.fm.x === x + 30, 'apply and synchronous HA echo');
          check(!!editor._layoutPanel.previewRoot.querySelector('svg'), 'preview after echo');
          temperature();
          const fallbackSvg = editor._layoutPanel.previewRoot.querySelector('svg')?.outerHTML;
          check(editor._layoutPanel.apply.disabled && !!fallbackSvg && fallbackSvg === canonicalSvg(), 'unsafe label uses canonical preview');
          temperature(); await waitFor(()=>!editor._layoutPanel.apply.disabled, 'live recovery'); check(!editor._layoutPanel.apply.disabled, 'live recovery');
          install(config); ui = editor._layoutPanel;
          await waitFor(()=>!ui.apply.disabled, 'reload validation');
          check(Number(ui.inputs.x.value) === x + 30 && !ui.apply.disabled, 'reload stored layout');
          result.textContent = `PASS (${checks.length}): ${checks.map(c => c.label).join('; ')}`; result.className = 'pass';
        } catch (error) { result.textContent = `FAIL: ${error.message}`; result.className = 'fail'; }
        return checks;
      }
      document.getElementById('reset').addEventListener('click', reset);
      document.getElementById('separated').addEventListener('click', separated);
      document.getElementById('temperature').addEventListener('click', temperature);
      document.getElementById('wp').addEventListener('click', wp);
      document.getElementById('volume').addEventListener('click', ()=>volume());
      document.getElementById('volume-short').addEventListener('click', ()=>volume(500));
      document.getElementById('viewport-events').addEventListener('click', ()=>{
        result.textContent=JSON.stringify(viewportEvents.slice(-20));
      });
      document.getElementById('viewport-contract').addEventListener('click', async()=>{
        const slot=document.createElement('div');
        slot.style.cssText='position:fixed;left:-10000px;top:0;width:320px;aspect-ratio:518/445;overflow:hidden';
        slot.innerHTML='<svg viewBox="0 -30 518 445" style="position:absolute;inset:0;width:100%;height:100%"><text x="137" y="338">500 l</text></svg><svg viewBox="0 -30 518 445" style="position:absolute;inset:0;width:100%;height:100%;visibility:hidden"><text x="167" y="353">500 l</text></svg>';
        document.body.append(slot);
        try {
          await document.fonts.ready;
          const [visible,staged]=slot.querySelectorAll('svg'), observations=[];
          for(const width of [320,420,320,420]) {
            slot.style.width=`${width}px`;
            const before=slot.getBoundingClientRect();
            visible.setAttribute('viewBox','0 -30 486 430');
            const changed=slot.getBoundingClientRect();
            visible.setAttribute('viewBox','0 -30 518 445');
            const after=slot.getBoundingClientRect(),a=visible.getScreenCTM(),b=staged.getScreenCTM();
            if ([before.width,before.height,changed.width,changed.height,after.width,after.height].some(n=>!Number.isFinite(n)) ||
                before.width!==changed.width || before.height!==changed.height || before.width!==after.width || before.height!==after.height ||
                !a || !b || ['a','b','c','d'].some(k=>Math.abs(a[k]-b[k])>1e-9)) throw new Error('host or matching viewport changed');
            observations.push({width:after.width,height:after.height,scale:a.a});
          }
          result.textContent=`PASS prototype only; no card text or paint approval: ${JSON.stringify(observations)}`;
        } catch(error) {result.textContent=`FAIL fixed viewport prototype: ${error.message}`;}
        finally {slot.remove();}
      });
      document.getElementById('viewport-real').addEventListener('click', async()=>{
        let container;
        try {
          targetProbes.length=0;
          volume(500);
          const draft=copy(editor._layoutDraft.history[editor._layoutDraft.index]);
          const saved={...copy(config),layout:draft};
          container=document.createElement('div');container.style.cssText='position:fixed;left:-10000px;top:0;width:320px';document.body.append(container);
          const mount=()=>{const card=document.createElement('warmwasser-schema-card');card._layoutFeatureEnabled=()=>true;
            container.replaceChildren(card);card.setConfig(copy(saved));card.hass=hass;return card;};
          let card=mount();const observations=[];
          const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
          await frame();
          if(!['div','warmwasser-schema-card'].every(owner=>targetProbes.some(p=>p.owner===owner && p.status==='validated-target-probe')))
            throw new Error(`separate editor/card target probes not proven: ${JSON.stringify(targetProbes)}`);
          for(const width of [320,420,320,420]) {
            container.style.width=`${width}px`;editor._layoutPanel.viewport.style.width=`${width}px`;await frame();
            const hosts=[card.shadowRoot.querySelector('[data-layout-viewport]'),editor._layoutPanel.previewRoot.querySelector('[data-layout-viewport]')];
            if(hosts.some(x=>!x)) throw new Error('missing card/editor host');
            const data=hosts.map(host=>{const box=host.getBoundingClientRect(),svg=host.querySelector('svg');
              return {width:box.width,height:box.height,viewBox:svg.getAttribute('viewBox')};});
            if(data.some(x=>!Number.isFinite(x.width) || !Number.isFinite(x.height) || x.width<=0 || x.height<=0) || data[0].viewBox!==data[1].viewBox)
              throw new Error('invalid or inconsistent card/editor viewport');
            observations.push(data);
          }
          const prior=card.shadowRoot.querySelector('[data-layout-viewport]').getBoundingClientRect();
          const priorBox=card.shadowRoot.querySelector('[data-layout-viewport] svg').getAttribute('viewBox');
          card=mount();await frame();const host=card.shadowRoot.querySelector('[data-layout-viewport]'),after=host?.getBoundingClientRect();
          if(!after || after.width!==prior.width || after.height!==prior.height || host.querySelector('svg').getAttribute('viewBox')!==priorBox)
            throw new Error('saved-layout reload changed the viewport');
          if(!editor._layoutPanel.apply.disabled) throw new Error('unproven text was enabled');
          result.textContent=`PASS real hosts and reload; no text/paint approval: ${JSON.stringify(observations)}`;
        } catch(error) {result.textContent=`FAIL real viewport: ${error.message}`;}
        finally {container?.remove();if(editor?._layoutPanel) editor._layoutPanel.viewport.style.width='';}
      });
      document.getElementById('simple-commit').addEventListener('click',async()=>{
        let host;
        try {
          hass={language:'en',states:{'sensor.fm':{state:'on'}}};
          install({type:'custom:warmwasser-schema-card',sprache:'en',speicher:{typ:'schicht'},fm:{pumpe:'sensor.fm'}});
          const ui=editor._layoutPanel,x=Number(ui.inputs.x.value),y=Number(ui.inputs.y.value);
          ui.inputs.x.value=String(x+30);ui.inputs.x.dispatchEvent(new Event('change',{bubbles:true}));
          ui.inputs.y.value=String(y+15);ui.inputs.y.dispatchEvent(new Event('change',{bubbles:true}));
          const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
          for(let i=0;i<30 && ui.apply.disabled;i++) await frame();
          if(ui.apply.disabled) throw Error(`editor not ready: ${ui.status.textContent}`);
          const preview=ui.previewRoot.querySelector('[data-layout-viewport] svg');
          if(!preview?.isConnected) throw Error('missing validated preview');
          ui.apply.click();
          if(config.layout?.components?.fm?.x!==x+30 || config.layout?.components?.fm?.y!==y+15) throw Error('configuration not emitted');
          host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:420px';document.body.append(host);
          const card=document.createElement('warmwasser-schema-card');card._layoutFeatureEnabled=()=>true;host.append(card);
          card.setConfig(copy(config));card.hass=hass;
          for(let i=0;i<30 && card._layoutStatus?.status!=='rendered-candidate';i++) await frame();
          if(card._layoutStatus?.status!=='rendered-candidate' || card._model.components.fm.origin.x!==x+30)
            throw Error(`card not committed: ${JSON.stringify(card._layoutStatus)}`);
          const svg=card.shadowRoot.querySelector('[data-layout-viewport] svg');
          if(!svg?.isConnected || !svg.querySelector('#wwNut')) throw Error('target SVG IDs missing');
          result.textContent='PASS experimental FM-only editor Apply, synchronous HA echo, independent card commit';
        } catch(error) {result.textContent=`FAIL FM-only commit: ${error.message}`;}
        finally {host?.remove();}
      });
      document.getElementById('wp-drag-setup').addEventListener('click',()=>{
        reset();const ui=editor._layoutPanel;
        ui.select.value='wp';ui.select.dispatchEvent(new Event('change',{bubbles:true}));
        ui.preview.scrollIntoView({block:'center'});ui.preview.focus();
        result.textContent='WP selected: drag the visible heat pump, or use arrow keys; observe X/Y and Apply status.';
      });
      document.getElementById('wp-diagnose').addEventListener('click',()=>{
        const state=editor._layoutDraftState(),job=layoutTextMeasurementJobs.get(editor),ui=editor._layoutPanel;
        result.textContent=`draft: ${JSON.stringify({status:state.status,errors:state.errors,layout:state.layout,ui:ui.status.textContent,applyDisabled:ui.apply.disabled,lastApply:editor.dataset.lastApply,job:job?{pending:job.pending,ready:job.ready,held:!!job.held}:null})}`;
      });
      document.getElementById('wp-drag-commit').addEventListener('click',async()=>{
        let host;

          ui.apply.click();if(config.layout?.components?.wp?.x!==(withSensors?x:x+30)||config.layout?.components?.wp?.y!==y+15)throw Error('layout not emitted');
          host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:420px';document.body.append(host);
          const mount=()=>{const card=document.createElement('warmwasser-schema-card');card._layoutFeatureEnabled=()=>true;host.replaceChildren(card);card.setConfig(copy(config));card.hass=hass;return card;};
          let card=mount();const committed=async()=>{for(let i=0;i<150&&card._layoutStatus?.status!=='rendered-candidate';i++)await frame();if(card._layoutStatus?.status!=='rendered-candidate')throw Error(`card: ${JSON.stringify(card._layoutStatus)}; inventory ${JSON.stringify(lastInventory)}; symbol ${JSON.stringify(lastSymbol)}; complete ${JSON.stringify(lastComplete)}; stage ${JSON.stringify(lastStage)}`);};
          await committed();card=mount();await committed();if(card._model.components.wp.origin.x!==(withSensors?x:x+30)||!card.shadowRoot.querySelector('svg')?.textContent.includes('41.0°'))throw Error('reload mismatch');
          card.hass={...hass,states:{...hass.states,'sensor.vl':{state:'100000000000'}}};if(card._layoutCandidate||card._layoutStatus?.status==='rendered-candidate')throw Error('overflow remained committed');
          result.textContent=`PASS ${type} solo WP undo/redo, Apply, live update, card reload and overflow rollback`;
        }catch(error){result.textContent=`FAIL solo WP: ${error.message}`;}finally{host?.remove();}
      }
      document.getElementById('solo-wp').addEventListener('click',()=>verifySoloWp());
      document.getElementById('solo-wp-baffle').addEventListener('click',()=>verifySoloWp('trennblech'));
      document.getElementById('solo-wp-sensors').addEventListener('click',()=>verifySoloWp('schicht',true));
      document.getElementById('solo-wp-extra').addEventListener('click',()=>verifySoloWp('schicht',true,true));
      document.getElementById('solo-wp-baffle-sensors').addEventListener('click',()=>verifySoloWp('trennblech',true));
      document.getElementById('wp-source-commit').addEventListener('click',()=>verifyWpCommit('schicht',false,true));
      document.getElementById('wp-sg-commit').addEventListener('click',()=>verifyWpCommit('schicht',true));
      document.getElementById('wp-commit').addEventListener('click',()=>verifyWpCommit());
      document.getElementById('baffle-wp-commit').addEventListener('click',()=>verifyWpCommit('trennblech'));
      document.getElementById('simple-stale').addEventListener('click',async()=>{
        try {
          const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve)),checks=[];
          const setup=async(live,withWp)=>{
            hass={language:'en',states:{'sensor.fm':{state:'on'},'sensor.temp':{state:'42'},'sensor.flow':{state:'3'},
              'sensor.wp':{state:'on'},'sensor.vl':{state:'40'},'sensor.rl':{state:'35'},'sensor.power':{state:'1200'},'sensor.cop':{state:'3.2'},'sensor.valve':{state:'on'}}};
            install({type:'custom:warmwasser-schema-card',sprache:'en',speicher:{typ:'schicht',...(live?{volumen:500}:{})},
              fm:{pumpe:'sensor.fm',...(live?{temp:'sensor.temp',durchfluss:'sensor.flow'}:{})},
              ...(withWp?{wp:{betrieb:'sensor.wp',vorlauf:'sensor.vl',ruecklauf:'sensor.rl',leistung:'sensor.power',cop:'sensor.cop',ventil:'sensor.valve'}}:{})});
            const ui=editor._layoutPanel,x=Number(ui.inputs.x.value),y=Number(ui.inputs.y.value);
            ui.inputs.x.value=String(x+30);ui.inputs.x.dispatchEvent(new Event('change',{bubbles:true}));
            ui.inputs.y.value=String(y+15);ui.inputs.y.dispatchEvent(new Event('change',{bubbles:true}));
            for(let i=0;i<30 && ui.apply.disabled;i++)await frame();
            if(ui.apply.disabled)throw Error(`fixture not ready: ${ui.status.textContent}`);
            return ui;
          };
          for(const [live,withWp] of [[false,false],[true,false],[true,true]]) for(const kind of ['svg','font','theme','resize','hass','disconnect','emit-error']) {
            const ui=await setup(live,withWp),svg=ui.previewRoot.querySelector('[data-layout-viewport] svg');
            if(kind==='svg') svg.querySelector('path.w0').setAttribute('d','M0 0H999');
            if(kind==='font') document.fonts.dispatchEvent(new Event('loading'));
            if(kind==='theme') {ui.preview.style.setProperty('--primary-text-color','#123456');await frame();}
            if(kind==='resize') {ui.viewport.style.width='300px';await frame();await frame();}
            if(kind==='hass') {hass={...hass,states:{...hass.states,...(withWp?{'sensor.wp':{state:'off'}}:{'sensor.fm':{state:'off'}})}};editor.hass=hass;}
            if(kind==='disconnect') editor.remove();
            if(kind==='emit-error') {
              editor._fire=()=>{throw Error('expected emit failure');};
              try {editor._applyLayoutDraft();throw Error('emit unexpectedly succeeded');} catch(error) {if(error.message!=='expected emit failure')throw error;}
              if(ui.previewRoot.querySelector('[data-layout-viewport] svg')===svg)throw Error('emit rollback did not restore fallback');
            } else {
              const outcome=editor._applyLayoutDraft();
              if(outcome?.status==='applied' || config.layout)throw Error(`${kind} allowed stale Apply`);
            }
            checks.push(`${withWp?'wp':live?'live':'simple'}:${kind}`);
          }
          result.textContent=`PASS real stale/rollback checks: ${checks.join(', ')}`;
        } catch(error) {result.textContent=`FAIL FM-only stale: ${error.message}`;}
      });
      async function verifyFmLiveCommit(type='schicht') {
        let host;
        try {
          hass={language:'en',states:{'sensor.fm':{state:'on'},'sensor.temp':{state:'42'},'sensor.flow':{state:'3'}}};
          install({type:'custom:warmwasser-schema-card',sprache:'en',speicher:{typ:type,volumen:500},
            fm:{pumpe:'sensor.fm',temp:'sensor.temp',durchfluss:'sensor.flow'}});
          const ui=editor._layoutPanel,x=Number(ui.inputs.x.value),y=Number(ui.inputs.y.value),frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
          ui.inputs.x.value=String(x+30);ui.inputs.x.dispatchEvent(new Event('change',{bubbles:true}));
          ui.inputs.y.value=String(y+15);ui.inputs.y.dispatchEvent(new Event('change',{bubbles:true}));
          const ready=async()=>{for(let i=0;i<60 && ui.apply.disabled;i++)await frame();if(ui.apply.disabled)throw Error(`editor not ready: ${ui.status.textContent}; inventory ${JSON.stringify(lastInventory)}; symbol ${JSON.stringify(lastSymbol)}; complete ${JSON.stringify(lastComplete)}; stage ${JSON.stringify(lastStage)}`);};
          await ready();
          hass={...hass,states:{...hass.states,'sensor.temp':{state:'43'}}};editor.hass=hass;
          if(!ui.apply.disabled)throw Error('HA change did not invalidate receipt');
          await ready();
          const preview=ui.previewRoot.querySelector('[data-layout-viewport] svg');
          if(!preview?.textContent.includes('500 l') || !preview.textContent.includes('43.0°') || !preview.textContent.includes('3 l/min'))
            throw Error('missing current volume or live values');
          ui.apply.click();if(config.layout?.components?.fm?.x!==x+30)throw Error('configuration not emitted');
          host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:420px';document.body.append(host);
          const mount=()=>{const card=document.createElement('warmwasser-schema-card');card._layoutFeatureEnabled=()=>true;
            host.replaceChildren(card);card.setConfig(copy(config));card.hass=hass;return card;};
          let card=mount();
          const committed=async()=>{for(let i=0;i<60 && card._layoutStatus?.status!=='rendered-candidate';i++)await frame();
            if(card._layoutStatus?.status!=='rendered-candidate')throw Error(`card not committed: ${JSON.stringify(card._layoutStatus)}`);};
          await committed();const before=card.shadowRoot.querySelector('[data-layout-viewport] svg');
          if(!before?.textContent.includes('43.0°'))throw Error('card live value differs');
          card=mount();await committed();
          if(card._model.components.fm.origin.x!==x+30)throw Error('saved layout not restored');
          card.hass={...hass,states:{...hass.states,'sensor.temp':{state:'1000000000'}}};
          if(card._layoutCandidate || card._layoutStatus?.status==='rendered-candidate')throw Error('oversized HA value remained committed');
          result.textContent='PASS FM volume/live HA update, editor Apply, independent card commit, reload and overflow fallback';
        } catch(error) {result.textContent=`FAIL FM live commit: ${error.message}`;}
        finally {host?.remove();}
      }
      document.getElementById('fm-live-commit').addEventListener('click',()=>verifyFmLiveCommit());
      document.getElementById('baffle-fm-commit').addEventListener('click',()=>verifyFmLiveCommit('trennblech'));
      let stopTouchDiagnostics=()=>{};
      function touchDiagnostics(width) {
        stopTouchDiagnostics(); reset();
        const ui=editor._layoutPanel, logs=[];
        ui.viewport.style.width=`${width}px`;ui.viewport.style.maxWidth='100%';
        ui.viewport.scrollIntoView({block:'center'});
        const note=message=>{logs.push(message);result.textContent=`Touch ${width}px: ${logs.slice(-5).join(' | ')}. Drag a device; scroll or pinch on empty space; use a second finger during drag.`;};
        const events=['pointerdown','pointermove','pointerup','pointercancel','lostpointercapture'];
        const record=event=>{if(event.type==='pointermove')return;note(`${event.type} ${event.pointerType||''} ${event.pointerId ?? ''}, drag ${editor._layoutDrag?'active':'inactive'}`);};
        const scroll=()=>note(`scroll top ${Math.round(window.scrollY)}, viewport ${ui.viewport.scrollLeft}/${ui.viewport.scrollTop}`);
        for(const type of events) document.addEventListener(type,record,true);
        document.addEventListener('scroll',scroll,true);window.visualViewport?.addEventListener('scroll',scroll);
        stopTouchDiagnostics=()=>{for(const type of events) document.removeEventListener(type,record,true);document.removeEventListener('scroll',scroll,true);window.visualViewport?.removeEventListener('scroll',scroll);};
        note(`overlay ${getComputedStyle(ui.overlay).pointerEvents}, ${ui.handles?.length||0} device hit areas`);
      }
      document.getElementById('touch-320').addEventListener('click',()=>touchDiagnostics(320));
      document.getElementById('touch-390').addEventListener('click',()=>touchDiagnostics(390));
      document.getElementById('resize-revalidate').addEventListener('click',async()=>{
        const host=document.getElementById('editor'), original=host.style.cssText;
        try {
          reset(); host.style.boxSizing='border-box';host.style.maxWidth='100%';host.style.width='320px';
          const ui=editor._layoutPanel,x=Number(ui.inputs.x.value),y=Number(ui.inputs.y.value);
          ui.inputs.x.value=String(x+30);ui.inputs.x.dispatchEvent(new Event('change',{bubbles:true}));
          ui.inputs.y.value=String(y+15);ui.inputs.y.dispatchEvent(new Event('change',{bubbles:true}));
          await waitFor(()=>!ui.apply.disabled && layoutTextMeasurementJobs.get(editor)?.ready,'initial validation');
          const checked=[];
          for(const width of [390,320,420]) {
            const previous=layoutTextMeasurementJobs.get(editor);
            host.style.width=`${width}px`;
            await waitFor(()=>{const job=layoutTextMeasurementJobs.get(editor);return job && job!==previous && job.ready && !ui.apply.disabled;},`resize ${width}px`);
            checked.push(Math.round(host.getBoundingClientRect().width));
          }
          result.textContent=`PASS resize revalidation: ${checked.join(', ')} px; fresh ready job each time`;result.className='pass';
        } catch(error) {result.textContent=`FAIL resize revalidation: ${error.message}; status ${editor._layoutPanel?.status.textContent}; job ${JSON.stringify(layoutTextMeasurementJobs.get(editor) && {pending:layoutTextMeasurementJobs.get(editor).pending,ready:layoutTextMeasurementJobs.get(editor).ready})}; stage ${JSON.stringify(lastStage)}; inventory ${JSON.stringify(lastInventory)}; symbol ${JSON.stringify(lastSymbol)}; complete ${JSON.stringify(lastComplete)}`;result.className='fail';}
        finally {host.style.cssText=original;}
      });
      document.getElementById('smoke').addEventListener('click', smoke);
      window.layoutHarness = { reset, separated, temperature, wp, smoke, viewportEvents, get editor() { return editor; }, get config() { return copy(config); } };
      reset();
      if (new URLSearchParams(location.search).has('smoke')) smoke();
    })();
  </script>
